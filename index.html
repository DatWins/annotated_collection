<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Annotated Collection</title>
<style>
  :root { --bg:#f4f6f8; --card:#fff; --ink:#1f2a36; --muted:#5b6b7b; --accent:#1d5fbf; --line:#d8dee5; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:Georgia, "Times New Roman", serif; }
  header { background:#2c3e50; color:#fff; padding:32px 16px; text-align:center; }
  header h1 { margin:0; font-size:2rem; letter-spacing:.5px; }
  header p { margin:8px 0 0; color:#c9d4df; }
  main { max-width:820px; margin:0 auto; padding:24px 16px 48px; }
  .book { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:18px; margin-bottom:16px; }
  .book h2 { margin:0 0 6px; font-size:1.25rem; }
  .book p { margin:0 0 14px; color:var(--muted); }
  .btns { display:flex; gap:10px; flex-wrap:wrap; }
  .btn { display:inline-block; padding:9px 16px; border-radius:6px; text-decoration:none; font-family:system-ui, sans-serif; font-size:.95rem; }
  .read { background:var(--accent); color:#fff; }
  .dl { border:1px solid var(--accent); color:var(--accent); }
  .empty { text-align:center; color:var(--muted); }
  footer { text-align:center; color:var(--muted); font-size:.85rem; padding-bottom:24px; }
</style>
</head>
<body>
<header>
  <h1>Annotated Collection</h1>
  <p>Chess books to read online or download for your e-reader</p>
</header>
<main id="list"></main>
<footer>Read online in the browser, or download the EPUB for Kobo and other e-readers.</footer>

<script>
  /* ============================================================
     YOUR BOOKS — to add a book:
       1. Upload the .epub into the "books" folder on GitHub
       2. Copy one { ... } block below, change the three lines
     The file name must match exactly (capitals and spaces count).
     ============================================================ */
  const BOOKS = [
    // {
    //   title: "Book Title",
    //   file: "book-file-name.epub",
    //   description: "Short description."
    // },
  ];

  const list = document.getElementById("list");
  if (!BOOKS.length) {
    list.innerHTML = '<p class="empty">No books yet.</p>';
  }
  BOOKS.forEach(b => {
    const path = "books/" + b.file;
    const div = document.createElement("div");
    div.className = "book";
    div.innerHTML =
      "<h2></h2><p></p><div class='btns'>" +
      "<a class='btn read'>Read online</a>" +
      "<a class='btn dl' download>Download EPUB</a></div>";
    div.querySelector("h2").textContent = b.title;
    div.querySelector("p").textContent = b.description || "";
    div.querySelector(".read").href = "reader.html?book=" + encodeURIComponent(b.file);
    div.querySelector(".dl").href = path;
    list.appendChild(div);
  });
</script>
</body>
</html>
